<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Kurslar katalogi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="courses">
        <div class="card">
            <h3>Frontend Asoslari</h3>
            <p>HTML, CSS va JavaScript bilan tanishish hamda amaliyot.</p>
            <button class="card-btn">Batafsil</button>
        </div>
        <div class="card">
            <h3>Backend Asoslari</h3>
            <p>C# va ASP.NET Core bilan server yaratish va sozlash.</p>
            <button class="card-btn">Batafsil</button>
        </div>
        <div class="card">
            <h3>Python Asoslari</h3>
            <p>Noldan Python tilida loyiha yaratish va algoritmlar.</p>
            <button class="card-btn">Batafsil</button>
        </div>
    </section>

    <div class="loader"></div>
</body>
</html>
